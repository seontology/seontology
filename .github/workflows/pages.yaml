name: Publish Site

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - develop
  # "Convert and Publish" commits regenerated seovoc.ttl/.owl with GITHUB_TOKEN,
  # which does not trigger push workflows; rebuild the site after it finishes.
  workflow_run:
    workflows:
      - Convert and Publish
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Build the latest main after a conversion run.
          ref: ${{ github.event_name == 'workflow_run' && 'main' || '' }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .site/requirements.txt

      - name: Install dependencies
        run: pip install -r .site/requirements.txt

      - name: Build site
        run: mkdocs build --strict

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
